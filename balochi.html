<!DOCTYPE html>

<head>

  <title>English to Balochi Dictionary</title>
  <meta name="description" content="A student-built English to Balochi dictionary with real translations collected from native speakers.">

      /* palette: Oatmeal Latte #EBEBDF + Atomic Orange #E9631A

      --babys-breath: #EBEBDF;     /* Oatmeal Latte - page background / light text */
      --purple-velvet: #E9631A;    /* Atomic Orange - buttons, borders */
      --shot-in-the-dark: #2A1A10; /* dark warm brown - body text */
      --spinel-violet: #A63F0B;    /* deep orange - headings, hover (readable on cream) */
      --blackcurrant: #C9530F;     /* Balochi banner */
      --fujinezumi: #D9733A;
      --mauve-musk: #F6C9A8;       /* soft orange tint - cards */

      /* roles */
      --bg: var(--babys-breath);
      --text: var(--shot-in-the-dark);
      --heading: var(--spinel-violet);
      --soft-card: var(--mauve-musk);
      --page-banner: var(--blackcurrant);   /* Balochi page colour */

      /* fonts */
      --font-heading: "Pathway Gothic One", "Arial Narrow", Impact, sans-serif;
      --font-body: Arial, Helvetica, sans-serif;
      --font-urdu: "Noto Naskh Arabic", "Segoe UI", Tahoma, serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      text-align: center;
      cursor: url("images/cursor.svg") 16 16, auto;
      -webkit-text-size-adjust: 100%;
    }
    h1, h3, h4 {
      font-family: var(--font-heading);
      font-variant: small-caps;
      font-weight: 400;
      letter-spacing: 0.03em;
    }
    header {
      background-color: var(--page-banner);
      padding: 25px 20px;
    }
    header h1 {
      color: var(--babys-breath);
      margin: 0;
      font-size: 54px;
      line-height: 1.05;
    }
    a.back-link {
      color: var(--babys-breath);
      font-size: 14px;
      display: inline-block;
      margin-bottom: 10px;
      text-decoration: none;
    }
    .search-area {
      padding: 40px 20px;
      position: relative;
      max-width: 420px;
      margin: 0 auto;
    }
    .search-row {
      display: flex;
      justify-content: center;
      gap: 8px;
    }
    input {
      padding: 12px;
      font-size: 18px;
      width: 260px;
      border: 2px solid var(--purple-velvet);
      border-radius: 8px;
      font-family: var(--font-body);
    }
    #micButton {
      padding: 10px 14px;
      font-size: 18px;
      background-color: var(--purple-velvet);
      color: var(--babys-breath);
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    #micButton:hover {
      background-color: var(--spinel-violet);
    }
    #suggestions {
      list-style: none;
      margin: 4px 0 0;
      padding: 0;
      text-align: left;
      background: white;
      border: 1px solid var(--mauve-musk);
      border-radius: 6px;
      max-width: 260px;
      margin-left: auto;
      margin-right: auto;
      display: none;
    }
    #suggestions li {
      padding: 8px 12px;
      cursor: pointer;
    }
    #suggestions li:hover {
      background-color: var(--soft-card);
    }
    #results {
      margin-top: 20px;
    }
    .word-card {
      background-color: var(--soft-card);
      border-radius: 10px;
      padding: 20px;
      max-width: 400px;
      margin: 15px auto;
      text-align: left;
      box-shadow: 2px 2px 6px rgba(42,26,16,0.2);
      position: relative;
    }
    .word-card h3 {
      color: var(--heading);
      font-size: 34px;
      line-height: 1.1;
      margin: 0 0 8px;
      display: inline-block;
    }
    .word-emoji {
      font-size: 24px;
      margin-right: 8px;
    }
    .native-script {
      direction: rtl;
      font-size: 26px;
      color: var(--spinel-violet);
      font-family: var(--font-urdu);
      margin: 6px 0;
    }
    .suggestion-note {
      font-size: 13px;
      color: var(--shot-in-the-dark);
      margin-top: 4px;
    }
    .star-button {
      position: absolute;
      top: 14px;
      right: 14px;
      font-size: 22px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--babys-breath);
    }
    .star-button.active {
      color: var(--spinel-violet);
    }
    .side-panel {
      max-width: 400px;
      margin: 30px auto 0;
      text-align: left;
    }
    .side-panel h4 {
      color: var(--heading);
      margin: 0 0 6px;
      font-size: 28px;
    }
    .chip-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .chip {
      background-color: white;
      border: 1px solid var(--purple-velvet);
      color: var(--spinel-violet);
      border-radius: 16px;
      padding: 4px 12px;
      font-size: 13px;
      font-family: var(--font-body);
      cursor: pointer;
    }
    .chip:hover {
      background-color: var(--purple-velvet);
      color: var(--babys-breath);
    }

    // Tries several spellings of each file name (as listed, lowercase, spaces or hyphens
    // instead of underscores, "word balochi mp3", just the word) and several file types.
    function candidateUrls(file) {
      const dot = file.lastIndexOf(".");
      const stem = file.slice(0, dot);
      const ext = file.slice(dot);
      const exts = [ext, ".m4a", ".mp3", ".aac"].filter(function (e, i, a) { return a.indexOf(e) === i; });
      const stems = [];
      function add(s) { if (s && !stems.includes(s)) stems.push(s); }
      function addVariants(s) {
        [s, s.toLowerCase()].forEach(function (v) {
          add(v);
          add(v.replace(/_+/g, " ").trim());
          add(v.replace(/_+/g, "-"));
        });
      }
      addVariants(stem);
      const m = stem.match(/^(.*?)_+(?:baloch|balochi|balchi)_+mp3/i);
      if (m) {
        const w = m[1];
        addVariants(w);
        [" baloch mp3", " balochi mp3", " baloch", " balochi", "_baloch", "_balochi"].forEach(function (tail) {
          add(w + tail);
          add(w.replace(/_/g, " ") + tail);
        });
      }
      // Names like Hello__Balochi__Mp3 were probably "Hello (Balochi) Mp3" or "Hello (Balochi) (Mp3)"
      if (stem.indexOf("__") !== -1) {
        const parts = stem.split(/__+/).map(function (p) { return p.replace(/_+/g, " ").trim(); }).filter(Boolean);
        const tail = parts.slice(1);
        for (let mask = 0; mask < (1 << tail.length); mask++) {
          const pieces = [parts[0]];
          tail.forEach(function (t, k) {
            pieces.push((mask >> k) & 1 ? "(" + t + ")" : t);
          });
          const joined = pieces.join(" ");
          add(joined);
          add(joined.toLowerCase());
        }
        add(parts[0]);
        add(parts[0].toLowerCase());
        add(parts.join(" "));
        // Your files are named like "Hello. Balochi. Mp3": try dots, commas and spaces between the parts
        const seps = [". ", ", ", " ", "."];
        if (parts.length <= 4) {
          const gaps = parts.length - 1;
          const total = Math.pow(seps.length, gaps);
          for (let n = 0; n < total; n++) {
            let s = parts[0];
            let rest = n;
            for (let g = 0; g < gaps; g++) {
              s += seps[rest % seps.length] + parts[g + 1];
              rest = Math.floor(rest / seps.length);
            }
            add(s);
            add(s.toLowerCase());
          }
        } else {
          seps.forEach(function (sep) { add(parts.join(sep)); });
        }
      }
      const urls = [];
      stems.forEach(function (s) {
        exts.forEach(function (e) {
          urls.push(audioFolder + encodeURIComponent(s + e));
        });
      });
      return urls;
    }

    function showVoiceNote(text) {
      const card = document.querySelector(".word-card");
      if (!card) return;
      const old = card.querySelector(".voice-note");
      if (old) old.remove();
      const msg = document.createElement("p");
      msg.className = "suggestion-note voice-note";
      msg.textContent = text;
      card.appendChild(msg);
    }

    let currentAudio = null;
    function playVoice(word) {
      const file = audioFiles[word];
      if (!file) return;
      const oldNote = document.querySelector(".voice-note");
      if (oldNote) oldNote.remove();
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }
      const urls = candidateUrls(file);

      function start(i) {
        const audio = new Audio(urls[i]);
        currentAudio = audio;
        let handled = false;

        function onFail(err) {
          if (handled) return;
          handled = true;
          if (currentAudio !== audio) return;
          if (err && err.name === "NotAllowedError") {
            showVoiceNote("Tap the Listen button again to play the sound.");
            return;
          }
          if (i + 1 < urls.length) {
            start(i + 1);   // try the next spelling or file type
          } else {
            showVoiceNote("Sorry, this recording isn't available right now.");
            // For the website owner only: open the browser console (F12) to see which file was missing
            console.warn("Balochi voice not found for \"" + word + "\". Looked for:", file, "and similar names in", audioFolder);
          }
        }

        audio.addEventListener("error", onFail);
        audio.play().catch(onFail);
      }

      start(0);
    }
    // ---------- END VOICES ----------

    const searchBox = document.getElementById("searchBox");
    const resultsDiv = document.getElementById("results");
    const suggestionsList = document.getElementById("suggestions");
    const micButton = document.getElementById("micButton");
    const historyList = document.getElementById("historyList");
    const bookmarkList = document.getElementById("bookmarkList");

    let memoryHistory = [];
    let memoryBookmarks = [];

    function loadList(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        return fallback;
      }
    }
    function saveList(key, arr, fallbackRef) {
      try {
        localStorage.setItem(key, JSON.stringify(arr));
      } catch (e) {
        fallbackRef.length = 0;
        fallbackRef.push(...arr);
      }
    }

    let history = loadList("balochi_history", memoryHistory);
    let bookmarks = loadList("balochi_bookmarks", memoryBookmarks);

    function renderChips(container, words, onClick) {
      container.innerHTML = "";
      if (words.length === 0) {
        container.innerHTML = `<span style="color:#A63F0B; font-size:13px;">None yet</span>`;
        return;
      }
      words.forEach(w => {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "chip";
        chip.textContent = w;
        chip.addEventListener("click", function() {
          searchBox.value = w;
          onClick(w);
        });
        container.appendChild(chip);
      });
    }

    function refreshPanels() {
      renderChips(historyList, history, function(w) {
        searchBox.dispatchEvent(new Event("input"));
      });
      renderChips(bookmarkList, bookmarks, function(w) {
        searchBox.dispatchEvent(new Event("input"));
      });
    }

    function addToHistory(word) {
      history = history.filter(w => w !== word);
      history.unshift(word);
      history = history.slice(0, 5);
      saveList("balochi_history", history, memoryHistory);
      refreshPanels();
    }

    function toggleBookmark(word) {
      if (bookmarks.includes(word)) {
        bookmarks = bookmarks.filter(w => w !== word);
      } else {
        bookmarks.unshift(word);
      }
      saveList("balochi_bookmarks", bookmarks, memoryBookmarks);
      refreshPanels();
    }

    function editDistance(a, b) {
      const dp = Array(a.length + 1).fill(null).map(() => Array(b.length + 1).fill(0));
      for (let i = 0; i <= a.length; i++) dp[i][0] = i;
      for (let j = 0; j <= b.length; j++) dp[0][j] = j;
      for (let i = 1; i <= a.length; i++) {
        for (let j = 1; j <= b.length; j++) {
          if (a[i - 1] === b[j - 1]) {
            dp[i][j] = dp[i - 1][j - 1];
          } else {
            dp[i][j] = 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
          }
        }
      }
      return dp[a.length][b.length];
    }

    function showResult(entry, note) {
      const isBookmarked = bookmarks.includes(entry.word);
      const hasAudio = !!audioFiles[entry.word];
      resultsDiv.innerHTML = `
        <div class="word-card">
          <button class="star-button ${isBookmarked ? 'active' : ''}" id="starBtn" aria-label="Bookmark this word">★</button>
          <h3><span class="word-emoji">${entry.emoji || ""}</span>${entry.word}</h3>
          <p class="native-script">${entry.script}</p>
          <p>Pronunciation: ${entry.meaning}</p>
          ${hasAudio ? `<button class="play-button" id="playBtn">🔊 Listen</button>` : ""}
          ${note ? `<p class="suggestion-note">${note}</p>` : ""}
        </div>
      `;
      document.getElementById("starBtn").addEventListener("click", function() {
        toggleBookmark(entry.word);
        showResult(entry, note);
      });
      const playBtn = document.getElementById("playBtn");
      if (playBtn) {
        playBtn.addEventListener("click", function() {
          playVoice(entry.word);
        });
      }
    }

    function updateSuggestions(query) {
      suggestionsList.innerHTML = "";
      if (query === "") {
        suggestionsList.style.display = "none";
        return;
      }
      const matches = dictionary.filter(entry => entry.word.startsWith(query));
      if (matches.length === 0) {
        suggestionsList.style.display = "none";
        return;
      }
      matches.slice(0, 5).forEach(entry => {
        const li = document.createElement("li");
        li.textContent = `${entry.emoji || ""} ${entry.word}`;
        li.addEventListener("click", function() {
          searchBox.value = entry.word;
          suggestionsList.style.display = "none";
          addToHistory(entry.word);
          showResult(entry);
        });
        suggestionsList.appendChild(li);
      });
      suggestionsList.style.display = "block";
    }

    searchBox.addEventListener("input", function() {
      const query = searchBox.value.toLowerCase().trim();
      resultsDiv.innerHTML = "";

      updateSuggestions(query);

      if (query === "") {
        return;
      }

      const exactMatch = dictionary.find(entry => entry.word === query);

      if (exactMatch) {
        showResult(exactMatch);
        return;
      }

      let closest = null;
      let closestDistance = 3;
      dictionary.forEach(entry => {
        const dist = editDistance(query, entry.word);
        if (dist < closestDistance) {
          closestDistance = dist;
          closest = entry;
        }
      });

      if (closest && closestDistance === 1 && query.length >= 4) {
        showResult(closest, `Auto-corrected from "${escapeHTML(query)}"`);
      } else if (closest) {
        resultsDiv.innerHTML = `<p class="suggestion-note">No exact match. Did you mean "<strong>${escapeHTML(closest.word)}</strong>"?</p>`;
      } else {
        resultsDiv.innerHTML = `<p>No match found.</p>`;
      }
    });

    // Save to "Recent searches" only when the person finishes typing (Enter or leaving the box)
    searchBox.addEventListener("change", function() {
      const q = searchBox.value.toLowerCase().trim();
      const hit = dictionary.find(e => e.word === q);
      if (hit) addToHistory(hit.word);
    });

    if ('webkitSpeechRecognition' in window) {
      const recognition = new webkitSpeechRecognition();
      recognition.lang = 'en-US';
      recognition.continuous = false;

      micButton.addEventListener("click", function() {
        try { recognition.start(); } catch (e) { /* already listening */ }
      });

      recognition.onresult = function(event) {
        const spokenWord = event.results[0][0].transcript;
        searchBox.value = spokenWord;
        searchBox.dispatchEvent(new Event("input"));
      };

      recognition.onerror = function(event) {
        resultsDiv.innerHTML = `<p>Voice input error. Try typing instead, or check your internet connection.</p>`;
      };
    } else {
      micButton.addEventListener("click", function() {
        resultsDiv.innerHTML = `<p>Voice input isn't supported in this browser.</p>`;
      });
    }

    refreshPanels();
  </script>

<script>
(function () {
  if (typeof dictionary === "undefined") return;

  var ROUND = 10;
  var questions = [];
  var index = 0;
  var score = 0;

  function el(tag, text, cls) {
    var n = document.createElement(tag);
    if (text) n.textContent = text;
    if (cls) n.className = cls;
    return n;
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  var wrap = el("div", "", "quiz-wrap");
  var startBtn = el("button", "\uD83C\uDFAF Quiz me", "quiz-start");
  var box = el("div", "", "quiz-box");
  wrap.appendChild(startBtn);
  wrap.appendChild(box);

  var anchor = document.querySelector(".search-area");
  if (anchor) {
    anchor.insertAdjacentElement("afterend", wrap);
  } else {
    document.body.appendChild(wrap);
  }

  function buildRound() {
    var seen = {};
    questions = [];
    shuffle(dictionary).forEach(function (e) {
      if (questions.length < ROUND && !seen[e.script]) {
        seen[e.script] = true;
        questions.push(e);
      }
    });
    index = 0;
    score = 0;
  }

  function optionsFor(correct) {
    var others = shuffle(dictionary.filter(function (e) {
      return e.script !== correct.script && e.word !== correct.word;
    }));
    var picks = [];
    var used = {};
    used[correct.word] = true;
    others.forEach(function (e) {
      if (picks.length < 3 && !used[e.word]) {
        used[e.word] = true;
        picks.push(e);
      }
    });
    return shuffle([correct].concat(picks));
  }

  function showQuestion() {
    var q = questions[index];
    box.innerHTML = "";

    box.appendChild(el("h3", "Quiz"));
    box.appendChild(el("p", "Question " + (index + 1) + " of " + questions.length + "  \u2022  Score: " + score, "quiz-count"));
    box.appendChild(el("p", q.script, "quiz-script"));
    box.appendChild(el("p", "Pronounced: " + q.meaning, "quiz-pron"));
    box.appendChild(el("p", "What does this word mean in English?", "quiz-count"));

    var list = el("div", "", "quiz-options");
    var feedback = el("p", "", "quiz-feedback");
    var next = el("button", index + 1 === questions.length ? "See my score" : "Next \u2192", "quiz-next");
    next.style.display = "none";

    optionsFor(q).forEach(function (opt) {
      var b = el("button", opt.word, "quiz-option");
      b.setAttribute("data-word", opt.word);
      b.addEventListener("click", function () {
        var all = list.querySelectorAll(".quiz-option");
        for (var i = 0; i < all.length; i++) {
          all[i].disabled = true;
          if (all[i].getAttribute("data-word") === q.word) {
            all[i].classList.add("correct");
          }
        }
        if (opt.word === q.word) {
          score++;
          feedback.textContent = "\u2713 Correct!";
        } else {
          b.classList.add("wrong");
          feedback.textContent = '\u2717 Not quite. It means "' + q.word + '".';
        }
        next.style.display = "inline-block";
      });
      list.appendChild(b);
    });

    next.addEventListener("click", function () {
      index++;
      if (index < questions.length) {
        showQuestion();
      } else {
        showScore();
      }
    });

    box.appendChild(list);
    box.appendChild(feedback);
    box.appendChild(next);
  }

  function showScore() {
    box.innerHTML = "";
    box.appendChild(el("h3", "Your score"));
    box.appendChild(el("p", score + " / " + questions.length, "quiz-final-score"));
    var msg = score >= 8 ? "Excellent!" : (score >= 5 ? "Well done, keep practising!" : "Good try. Search some words and play again!");
    box.appendChild(el("p", msg, "quiz-feedback"));
    var again = el("button", "Play again", "quiz-next");
    again.addEventListener("click", start);
    box.appendChild(again);
  }

  function start() {
    buildRound();
    box.style.display = "block";
    showQuestion();
    box.scrollIntoView({ behavior: "smooth", block: "center" });
  }

  startBtn.addEventListener("click", start);
})();
</script>
