<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>English to Pashto Dictionary</title>
  <meta name="description" content="A student-built English to Pashto dictionary with real translations collected from native speakers.">
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#A63F0B">

  <!-- Fonts: downloaded by every visitor's browser, so they look the same on all devices -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;500&family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      /* palette: Oatmeal Latte #EBEBDF + Atomic Orange #E9631A
         (variable names kept from the old purple palette so nothing else had to change) */
      --babys-breath: #EBEBDF;     /* Oatmeal Latte - page background / light text */
      --purple-velvet: #E9631A;    /* Atomic Orange - buttons, borders */
      --shot-in-the-dark: #2A1A10; /* dark warm brown - body text */
      --spinel-violet: #A63F0B;    /* deep orange - headings, hover, Pashto banner */
      --blackcurrant: #C9530F;
      --fujinezumi: #D9733A;
      --mauve-musk: #F6C9A8;       /* soft orange tint - cards */

      /* roles */
      --bg: var(--babys-breath);
      --text: var(--shot-in-the-dark);
      --heading: var(--spinel-violet);
      --soft-card: var(--mauve-musk);
      --page-banner: var(--spinel-violet);   /* Pashto page colour */

      /* fonts */
      --font-heading: "Bebas Neue", "Arial Narrow", Impact, sans-serif;
      --font-body: "Poppins", Arial, Helvetica, sans-serif;
      --font-urdu: "Noto Naskh Arabic", "Segoe UI", Tahoma, serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      text-align: center;
      cursor: url("images/cursor.svg") 16 16, auto;
      -webkit-text-size-adjust: 100%;
    }
    h1, h3, h4 {
      font-family: var(--font-heading);
      font-variant: small-caps;
      font-weight: 400;
      letter-spacing: 0.03em;
    }
    header {
      background-color: var(--page-banner);
      padding: 25px 20px;
    }
    header h1 {
      color: var(--babys-breath);
      margin: 0;
      font-size: 54px;
      line-height: 1.05;
    }
    a.back-link {
      color: var(--babys-breath);
      font-size: 14px;
      display: inline-block;
      margin-bottom: 10px;
      text-decoration: none;
    }
    .search-area {
      padding: 40px 20px;
      position: relative;
      max-width: 420px;
      margin: 0 auto;
    }
    .search-row {
      display: flex;
      justify-content: center;
      gap: 8px;
    }
    input {
      padding: 12px;
      font-size: 18px;
      width: 260px;
      border: 2px solid var(--purple-velvet);
      border-radius: 8px;
      font-family: var(--font-body);
    }
    #micButton {
      padding: 10px 14px;
      font-size: 18px;
      background-color: var(--purple-velvet);
      color: var(--babys-breath);
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    #micButton:hover {
      background-color: var(--spinel-violet);
    }
    #suggestions {
      list-style: none;
      margin: 4px 0 0;
      padding: 0;
      text-align: left;
      background: white;
      border: 1px solid var(--mauve-musk);
      border-radius: 6px;
      max-width: 260px;
      margin-left: auto;
      margin-right: auto;
      display: none;
    }
    #suggestions li {
      padding: 8px 12px;
      cursor: pointer;
    }
    #suggestions li:hover {
      background-color: var(--soft-card);
    }
    #results {
      margin-top: 20px;
    }
    .word-card {
      background-color: var(--soft-card);
      border-radius: 10px;
      padding: 20px;
      max-width: 400px;
      margin: 15px auto;
      text-align: left;
      box-shadow: 2px 2px 6px rgba(42,26,16,0.2);
      position: relative;
    }
    .word-card h3 {
      color: var(--heading);
      font-size: 34px;
      line-height: 1.1;
      margin: 0 0 8px;
      display: inline-block;
    }
    .word-emoji {
      font-size: 24px;
      margin-right: 8px;
    }
    .native-script {
      direction: rtl;
      font-size: 26px;
      color: var(--spinel-violet);
      font-family: var(--font-urdu);
      margin: 6px 0;
    }
    .suggestion-note {
      font-size: 13px;
      color: var(--shot-in-the-dark);
      margin-top: 4px;
    }
    .star-button {
      position: absolute;
      top: 14px;
      right: 14px;
      font-size: 22px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--babys-breath);
    }
    .star-button.active {
      color: var(--spinel-violet);
    }
    .side-panel {
      max-width: 400px;
      margin: 30px auto 0;
      text-align: left;
    }
    .side-panel h4 {
      color: var(--heading);
      margin: 0 0 6px;
      font-size: 28px;
    }
    .chip-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .chip {
      background-color: white;
      border: 1px solid var(--purple-velvet);
      color: var(--spinel-violet);
      border-radius: 16px;
      padding: 4px 12px;
      font-size: 13px;
      font-family: var(--font-body);
      cursor: pointer;
    }
    .chip:hover {
      background-color: var(--purple-velvet);
      color: var(--babys-breath);
    }

    /* Voices: Listen button on word cards */
    .listen-button {
      font-family: var(--font-body);
      background-color: var(--purple-velvet);
      color: var(--babys-breath);
      border: none;
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 15px;
      cursor: pointer;
      margin-top: 4px;
      margin-right: 6px;
    }
    .listen-button:hover {
      background-color: var(--spinel-violet);
    }
    .listen-button:focus-visible {
      outline: 3px solid var(--shot-in-the-dark);
      outline-offset: 2px;
    }

    /* Mobile responsiveness */
    @media (max-width: 600px) {
      header h1 {
        font-size: 38px;
      }
      .search-area {
        max-width: 95%;
        padding: 30px 10px;
      }
      .search-row {
        flex-direction: column;
        align-items: center;
      }
      input {
        width: 85%;
      }
      #micButton {
        margin-top: 8px;
      }
      .word-card, .side-panel {
        max-width: 95%;
      }
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="back-link">← Back to Home</a>
    &nbsp;&nbsp;•&nbsp;&nbsp;
    <a href="compare.html" class="back-link">⇄ Compare Languages</a>
    <h1>English → Pashto Dictionary</h1>
  </header>
  <div class="search-area">
    <div class="search-row">
      <input type="text" id="searchBox" placeholder="Type an English word..." autocomplete="off">
      <button id="micButton" title="Search by voice" aria-label="Search by voice">🎤</button>
    </div>
    <ul id="suggestions"></ul>
    <div id="results"></div>

    <div class="side-panel">
      <h4>Recent searches</h4>
      <div id="historyList" class="chip-list"></div>
    </div>

    <div class="side-panel">
      <h4>Bookmarked words</h4>
      <div id="bookmarkList" class="chip-list"></div>
    </div>
  </div>

  <script>
    // Voices are separate files in audios/pashto/ (see VOICE_FOLDER below)
    const VOICE_DATA = {};
  </script>

  <!-- The Pashto word list now lives in its own file: data/pashto.js -->
  <script src="data/pashto.js" charset="utf-8"></script>

  <script>
    const dictionary = window.DICT_PASHTO;

    // Makes text safe to put inside HTML
    function escapeHTML(s) {
      return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
                      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    const searchBox = document.getElementById("searchBox");
    const resultsDiv = document.getElementById("results");
    const suggestionsList = document.getElementById("suggestions");
    const micButton = document.getElementById("micButton");
    const historyList = document.getElementById("historyList");
    const bookmarkList = document.getElementById("bookmarkList");

    let memoryHistory = [];
    let memoryBookmarks = [];

    function loadList(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        return fallback;
      }
    }
    function saveList(key, arr, fallbackRef) {
      try {
        localStorage.setItem(key, JSON.stringify(arr));
      } catch (e) {
        fallbackRef.length = 0;
        fallbackRef.push(...arr);
      }
    }

    let history = loadList("pashto_history", memoryHistory);
    let bookmarks = loadList("pashto_bookmarks", memoryBookmarks);

    // Voices: words that have a recording in audios/pashto/
    // To add a voice later: put the file in audios/pashto/ and add the word to VOICE_WORDS.
    const VOICE_FOLDER = "audios/pashto/";
    const VOICE_EXTENSIONS = [".m4a", ".mp3", ".aac"]; // tries .m4a, then .mp3, then .aac
    const VOICE_WORDS = [
      "brother","child","daughter","father","grandfather","grandmother","mother","parent",
      "relative","sibling","sister","son","wife",
      "ankle","apple","arm","back","banana","basket","blanket","blood","bone","bottle","bowl",
      "box","brain","bread","bride","broom","brother-in-law","brush","bucket","butter","candle",
      "carpet","carrot","ceiling","cheese","chest","chicken","clock","compass","coriander","corn",
      "cucumber","curry","curtain","date","door","egg","eye","family","father-in-law","fence",
      "finger","fish","friend","fruit","garden","ginger","glasses","grapes","groom","guardian",
      "hand","head","heart","honey","jar","key","kitchen","knee","knife","lamp","lentils","mango",
      "map","mask","meat","melon","microscope","milk","mother-in-law","mouth","neck","neighbor",
      "nose","oil","onion","orange","orphan","pan","peach","pear","pillow","plate","potato",
      "puzzle","refrigerator","rice","roof","room","rug","salt","shelf","shoulder","sink",
      "sister-in-law","skin","soap","soup","spinach","stairs","stepfather","stepmother","stomach",
      "stool","stove","sugar","suitcase","sweet","table","tap","tea","telescope","toe","tongue",
      "towel","turmeric","twin","umbrella","vegetable","wall","walnut","watch","water","wheat",
      "yogurt",
      // new recordings
      "baby","balloon","bathroom","bedroom","bench","comb","congratulations","cousin","cup",
      "doll","ear","elbow","elder","excuse me","fan","flag","fork","garlic","good morning",
      "good night","goodbye","guest","hair","hello","husband","ladder","lip","lock","matchbox",
      "mirror","nephew","niece","nut","please","pot","rope","see you later","sofa","sorry",
      "spoon","sugarcane","teeth","thank you","tomato","toy","welcome","widow","wrist",
      "yes please",
      // .aac recordings
      "bed","biscuit","cake","chair","chili","chin","coffee","cumin","cupboard","floor","foot",
      "house","juice","leg","lemon","pepper","pistachio","pomegranate","pumpkin","window",
      "almond","bag",
      // newest recordings
      "nice to meet you","widower"
    ];
    // Words whose file name is different from the word
    const VOICE_FILE_NAMES = {
      brother: "brother_",
      child: "Child_",
      daughter: "daughter_",
      grandfather: "grand_father_",
      grandmother: "grand_mother_",
      mother: "mother_",
      parent: "parents_",
      relative: "relatives",
      sibling: "siblings",
      sister: "sister_",
      wife: "wife_",
      "brother-in-law": "brother_in_law",
      "excuse me": "excuse_me",
      flag: "flag_pushto",
      garlic: "garlic_pushto",
      "good morning": "good_morning",
      "good night": "good_night",
      "thank you": "thank_you",
      toy: "toy_pushto",
      sugarcane: "sugarcan",
      nut: "nuts",
      "see you later": "see_you_later",
      "yes please": "yes_please",
      "nice to meet you": "nice_to_meet_you",
      lip: "lips",
      neck: "neck_pasto",
      bed: "bed_pashto_mp3_",
      biscuit: "biscuit_pashto_mp3_",
      cake: "cake_pashto_mp3_",
      chair: "chair_pashto_mp3_",
      chili: "chilli_pashto_mp3_",
      chin: "chin_pashto_mp3_",
      coffee: "coffee_pashto_mp3_",
      cumin: "cumin_pashto_mp3",
      cupboard: "cupboard_pashto_mp3",
      floor: "floor_pashto_mp3",
      foot: "foot_pashto_mp3_",
      house: "house_pashto_mp3",
      juice: "juice_pashto_mp3",
      leg: "leg_pashto_mp3_",
      lemon: "lemon_pashto_mp3_",
      pepper: "pepper_pashto_mp3_",
      pistachio: "pistachio_pashto_mp3_",
      pomegranate: "pomegranate_pashto_mp3_",
      pumpkin: "pumpkin_pashto_mp3_",
      window: "window_pashto_mp3_",
      almond: "almond_pashto_mp3_",
      bag: "bag_pashto_mp3_",
      carpet: "carpet_or_rug",
      rug: "carpet_or_rug",
      clock: "clock_or_watch",
      watch: "clock_or_watch"
    };
    // Words with two recordings (one button for each recording on the card)
    const VOICE_MULTI = {
      aunt: [
        { label: "Tror", file: "aunty_" },
        { label: "Māmā Khor", file: "maternal_aunty_" }
      ],
      uncle: [
        { label: "Təra", file: "uncle_" },
        { label: "Māmā", file: "maternal_uncle_" }
      ],
      "what is your name?": [
        { label: "Casual", file: "what_is_your_name" },
        { label: "Formal", file: "what_is_your_name__formal_" }
      ],
      "how are you?": [
        { label: "Casual", file: "how_are_you" },
        { label: "Formal", file: "how_are_you___formal__pushto" }
      ]
    };

    // Returns the path WITHOUT the file type; playVoice adds .m4a or .mp3
    function voiceSrc(stem) {
      return VOICE_FOLDER + stem;
    }

    function voicesFor(word) {
      if (VOICE_MULTI[word]) {
        return VOICE_MULTI[word].map(v => ({ label: v.label, src: voiceSrc(v.file) }));
      }
      if (!VOICE_WORDS.includes(word)) return [];
      return [{ label: "", src: voiceSrc(VOICE_FILE_NAMES[word] || word) }];
    }

    let voicePlayer = null;
    let voiceButton = null;
    let voiceButtonText = "";

    function stopVoice() {
      if (voicePlayer) voicePlayer.pause();
      if (voiceButton) voiceButton.textContent = voiceButtonText;
      voicePlayer = null;
      voiceButton = null;
    }

    function showVoiceError(card, src) {
      const msg = document.createElement("p");
      msg.className = "suggestion-note voice-error";
      msg.textContent = "Couldn't play this recording. Check your device volume and try another browser.";
      card.appendChild(msg);
    }

    // Tries several spellings of the file name (plain, lowercase, no trailing _, no _pushto, - or space instead of _)
    function candidateUrls(src) {
      const name = src.slice(VOICE_FOLDER.length);
      const base = name.replace(/_+$/, "").replace(/_(pashto|pushto|pasto)$/i, "").replace(/_+$/, "");
      const stems = [];
      [base, name].forEach(function (b) {
        [b, b.toLowerCase()].forEach(function (s) {
          [s, s.replace(/_/g, "-"), s.replace(/_/g, " ")].forEach(function (v) {
            if (!stems.includes(v)) stems.push(v);
          });
        });
      });
      // Files like bed_pashto_mp3_.aac may really be "bed pashto (mp3)", "bed pashto" or just "bed"
      const m = name.match(/^(.*?)_pashto_mp3_*$/i);
      if (m) {
        const w = m[1];
        [w + " pashto (mp3)", w + " pashto(mp3)", w + " pashto", w + "_pashto", w + "_pashto_mp3", w].forEach(function (v) {
          if (!stems.includes(v)) stems.push(v);
        });
      }
      const urls = [];
      stems.forEach(function (s) {
        VOICE_EXTENSIONS.forEach(function (e) {
          urls.push(encodeURI(VOICE_FOLDER + s + e));
        });
      });
      return urls;
    }

    function playVoice(src, button) {
      const sameButton = voiceButton === button;
      stopVoice();
      if (sameButton) return;

      const card = button.closest(".word-card");
      const oldMsg = card.querySelector(".voice-error");
      if (oldMsg) oldMsg.remove();

      voiceButton = button;
      voiceButtonText = button.textContent;
      button.textContent = "🔊 Playing...";

      const urls = candidateUrls(src);

      function start(i) {
        const audio = new Audio(urls[i]);
        voicePlayer = audio;
        let handled = false;

        function onFail() {
          if (handled) return;
          handled = true;
          if (voicePlayer !== audio) return;
          if (i + 1 < urls.length) {
            start(i + 1);          // try the next spelling or file type
          } else {
            stopVoice();
            showVoiceError(card, src);
          }
        }

        audio.addEventListener("ended", stopVoice);
        audio.addEventListener("error", onFail);
        audio.play().catch(onFail);
      }

      start(0);
    }

    function renderChips(container, words, onClick) {
      container.innerHTML = "";
      if (words.length === 0) {
        container.innerHTML = `<span style="color:#A63F0B; font-size:13px;">None yet</span>`;
        return;
      }
      words.forEach(w => {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "chip";
        chip.textContent = w;
        chip.addEventListener("click", function() {
          searchBox.value = w;
          onClick(w);
        });
        container.appendChild(chip);
      });
    }

    function refreshPanels() {
      renderChips(historyList, history, function(w) {
        searchBox.dispatchEvent(new Event("input"));
      });
      renderChips(bookmarkList, bookmarks, function(w) {
        searchBox.dispatchEvent(new Event("input"));
      });
    }

    function addToHistory(word) {
      history = history.filter(w => w !== word);
      history.unshift(word);
      history = history.slice(0, 5);
      saveList("pashto_history", history, memoryHistory);
      refreshPanels();
    }

    function toggleBookmark(word) {
      if (bookmarks.includes(word)) {
        bookmarks = bookmarks.filter(w => w !== word);
      } else {
        bookmarks.unshift(word);
      }
      saveList("pashto_bookmarks", bookmarks, memoryBookmarks);
      refreshPanels();
    }

    function editDistance(a, b) {
      const dp = Array(a.length + 1).fill(null).map(() => Array(b.length + 1).fill(0));
      for (let i = 0; i <= a.length; i++) dp[i][0] = i;
      for (let j = 0; j <= b.length; j++) dp[0][j] = j;
      for (let i = 1; i <= a.length; i++) {
        for (let j = 1; j <= b.length; j++) {
          if (a[i - 1] === b[j - 1]) {
            dp[i][j] = dp[i - 1][j - 1];
          } else {
            dp[i][j] = 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
          }
        }
      }
      return dp[a.length][b.length];
    }

    function showResult(entry, note) {
      const isBookmarked = bookmarks.includes(entry.word);
      const voices = voicesFor(entry.word);
      resultsDiv.innerHTML = `
        <div class="word-card">
          <button class="star-button ${isBookmarked ? 'active' : ''}" id="starBtn" aria-label="Bookmark this word">★</button>
          <h3><span class="word-emoji">${entry.emoji || ""}</span>${entry.word}</h3>
          <p class="native-script">${entry.script}</p>
          <p>Pronunciation: ${entry.meaning}</p>
          ${voices.length ? `<div>${voices.map((v, i) => `<button type="button" class="listen-button" data-voice="${i}">🔊 Listen${v.label ? " (" + v.label + ")" : ""}</button>`).join("")}</div>` : ""}
          ${note ? `<p class="suggestion-note">${note}</p>` : ""}
        </div>
      `;
      document.getElementById("starBtn").addEventListener("click", function() {
        toggleBookmark(entry.word);
        showResult(entry, note);
      });
      resultsDiv.querySelectorAll(".listen-button").forEach(function(btn) {
        btn.addEventListener("click", function() {
          playVoice(voices[btn.dataset.voice].src, btn);
        });
      });
    }

    function updateSuggestions(query) {
      suggestionsList.innerHTML = "";
      if (query === "") {
        suggestionsList.style.display = "none";
        return;
      }
      const matches = dictionary.filter(entry => entry.word.startsWith(query));
      if (matches.length === 0) {
        suggestionsList.style.display = "none";
        return;
      }
      matches.slice(0, 5).forEach(entry => {
        const li = document.createElement("li");
        li.textContent = `${entry.emoji || ""} ${entry.word}`;
        li.addEventListener("click", function() {
          searchBox.value = entry.word;
          suggestionsList.style.display = "none";
          addToHistory(entry.word);
          showResult(entry);
        });
        suggestionsList.appendChild(li);
      });
      suggestionsList.style.display = "block";
    }

    searchBox.addEventListener("input", function() {
      const query = searchBox.value.toLowerCase().trim();
      resultsDiv.innerHTML = "";

      updateSuggestions(query);

      if (query === "") {
        return;
      }

      const exactMatch = dictionary.find(entry => entry.word === query);

      if (exactMatch) {
        showResult(exactMatch);
        return;
      }

      let closest = null;
      let closestDistance = 3;
      dictionary.forEach(entry => {
        const dist = editDistance(query, entry.word);
        if (dist < closestDistance) {
          closestDistance = dist;
          closest = entry;
        }
      });

      if (closest && closestDistance === 1 && query.length >= 4) {
        showResult(closest, `Auto-corrected from "${escapeHTML(query)}"`);
      } else if (closest) {
        resultsDiv.innerHTML = `<p class="suggestion-note">No exact match. Did you mean "<strong>${escapeHTML(closest.word)}</strong>"?</p>`;
      } else {
        resultsDiv.innerHTML = `<p>No match found.</p>`;
      }
    });

    // Save to "Recent searches" only when the person finishes typing (Enter or leaving the box)
    searchBox.addEventListener("change", function() {
      const q = searchBox.value.toLowerCase().trim();
      const hit = dictionary.find(e => e.word === q);
      if (hit) addToHistory(hit.word);
    });

    if ('webkitSpeechRecognition' in window) {
      const recognition = new webkitSpeechRecognition();
      recognition.lang = 'en-US';
      recognition.continuous = false;

      micButton.addEventListener("click", function() {
        try { recognition.start(); } catch (e) { /* already listening */ }
      });

      recognition.onresult = function(event) {
        const spokenWord = event.results[0][0].transcript;
        searchBox.value = spokenWord;
        searchBox.dispatchEvent(new Event("input"));
      };

      recognition.onerror = function(event) {
        resultsDiv.innerHTML = `<p>Voice input error. Try typing instead, or check your internet connection.</p>`;
      };
    } else {
      micButton.addEventListener("click", function() {
        resultsDiv.innerHTML = `<p>Voice input isn't supported in this browser.</p>`;
      });
    }

    refreshPanels();
  </script>

  <!-- PASHTO QUIZ START -->
  <style>
    .quiz-wrap {

  <script>
  (function () {
    if (document.getElementById("languageQuiz")) return;

    function make(tag, text, className) {
      const node = document.createElement(tag);
      node.textContent = text;
      if (className) node.className = className;
      if (tag === "button") node.type = "button";
      return node;
    }

    function shuffle(items) {
      const copy = items.slice();

      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }

      return copy;
    }

    const wrap = make("div", "", "quiz-wrap");
    wrap.id = "languageQuiz";

    const startButton = make("button", "🎯 Quiz me", "quiz-start");
    const box = make("div", "", "quiz-box");
    box.hidden = true;

    wrap.append(startButton, box);
    document.querySelector(".search-area")
      .insertAdjacentElement("afterend", wrap);

    let questions = [];
    let questionIndex = 0;
    let score = 0;

    function startQuiz() {
      const seen = new Set();

      questions = shuffle(dictionary).filter(function (entry) {
        const script = entry.script.trim();

        if (seen.has(script)) return false;

        seen.add(script);
        return true;
      }).slice(0, 10);

      questionIndex = 0;
      score = 0;
      box.hidden = false;
      showQuestion();
      box.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    function getChoices(question) {
      const usedWords = new Set([question.word]);
      const choices = [question];

      shuffle(dictionary).forEach(function (entry) {
        if (
          choices.length < 4 &&
          entry.script.trim() !== question.script.trim() &&
          !usedWords.has(entry.word)
        ) {
          usedWords.add(entry.word);
          choices.push(entry);
        }
      });

      return shuffle(choices);
    }

    function showQuestion() {
      box.textContent = "";

      const question = questions[questionIndex];
      let answered = false;

      const counter = make(
        "p",
        "Question " + (questionIndex + 1) +
        " of " + questions.length + " • Score: " + score
      );

      box.append(
        make("h3", "Pashto Quiz"),
        counter,
        make("p", question.script, "quiz-script"),
        make("p", "Pronounced: " + question.meaning, "quiz-pron"),
        make("p", "What does this word mean in English?")
      );

      const options = make("div", "", "quiz-options");
      const feedback = make("p", "", "quiz-feedback");
      feedback.setAttribute("aria-live", "polite");

      const next = make(
        "button",
        questionIndex === questions.length - 1
          ? "See my score"
          : "Next →",
        "quiz-next"
      );
      next.hidden = true;

      getChoices(question).forEach(function (choice) {
        const button = make("button", choice.word, "quiz-option");
        button.dataset.word = choice.word;

        button.addEventListener("click", function () {
          if (answered) return;
          answered = true;

          options.querySelectorAll("button").forEach(function (item) {
            item.disabled = true;

            if (item.dataset.word === question.word) {
              item.classList.add("correct");
            }
          });

          if (choice.word === question.word) {
            score++;
            feedback.textContent = "✓ Correct!";
          } else {
            button.classList.add("wrong");
            feedback.textContent =
              '✗ Not quite. The answer is "' + question.word + '".';
          }

          counter.textContent =
            "Question " + (questionIndex + 1) +
            " of " + questions.length + " • Score: " + score;

          next.hidden = false;
        });

        options.appendChild(button);
      });

      next.addEventListener("click", function () {
        questionIndex++;

        if (questionIndex < questions.length) {
          showQuestion();
        } else {
          showScore();
        }
      });

      box.append(options, feedback, next);
    }

    function showScore() {
      box.textContent = "";

      const message = score >= 8
        ? "Excellent!"
        : score >= 5
          ? "Well done—keep practising!"
          : "Good try! Explore some words and play again.";

      const again = make("button", "Play again", "quiz-next");
      again.addEventListener("click", startQuiz);

      box.append(
        make("h3", "Your score"),
        make(
          "p",
          score + " / " + questions.length,
          "quiz-final-score"
        ),
        make("p", message),
        again
      );
    }

    startButton.addEventListener("click", startQuiz);
  })();
  </script>
  <!-- PASHTO QUIZ END -->

  <script>
  (function () {
    // This page: Pashto
    var FB_LANG = "Pashto";

    var overlay = document.getElementById('fbOverlay');
    var langSelect = document.getElementById('fbLangSelect');
    document.getElementById('fbPage').value = FB_LANG + ' page';

    langSelect.value = FB_LANG;
    document.getElementById('fbTitle').textContent = FB_LANG + ' Dictionary: Help us improve';

    document.getElementById('fbOpen').onclick = function () { overlay.classList.add('open'); };
    document.getElementById('fbClose').onclick = function () { overlay.classList.remove('open'); };
    overlay.onclick = function (e) { if (e.target === overlay) overlay.classList.remove('open'); };

    document.querySelectorAll('.fb-tab').forEach(function (tab) {
      tab.onclick = function () {
        document.querySelectorAll('.fb-tab').forEach(function (t) { t.classList.remove('active'); });
        document.querySelectorAll('.fb-form').forEach(function (f) { f.classList.remove('show'); });
        tab.classList.add('active');
        document.getElementById(tab.dataset.target).classList.add('show');
      };
    });

    document.querySelectorAll('.fb-form').forEach(function (form) {
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var box = form.querySelector('.fb-msg');
        box.className = 'fb-msg';
        fetch(form.action, {
          method: 'POST',
          body: new FormData(form),
          headers: { 'Accept': 'application/json' }
        }).then(function (res) {
          if (res.ok) {
            box.textContent = '✅ Thank you! Your message has been sent.';
            box.className = 'fb-msg ok';
            form.reset();
            langSelect.value = FB_LANG;
          } else {
            box.textContent = '❌ Something went wrong. Please try again.';
            box.className = 'fb-msg err';
          }
        }).catch(function () {
          box.textContent = '❌ No internet connection. Please try again later.';
          box.className = 'fb-msg err';
        });
      });
    });
  })();
  </script>
